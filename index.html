:root{--bg:#FFF0B3;--sun:#FFD23F;--ink:#1B1B2F;--muted:#4A4960;--pink:#E2336B;--violet:#7B61FF;--teal:#1FBFA9;--card:#FFFFFF;
  --head:'Unbounded','Arial Black',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px calc(32px + env(safe-area-inset-bottom))}
.hello{font-weight:900;font-size:16px;color:var(--pink)}
h1{font-family:var(--head);font-weight:700;font-size:clamp(30px,9vw,44px);line-height:1.05;letter-spacing:-1px;margin:6px 0 10px}
.lead{color:var(--muted);font-weight:600;margin-bottom:24px}
.list{display:flex;flex-direction:column;gap:16px}
a.item{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:18px}
a.item:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.ico{flex:none;width:56px;height:56px;border:3px solid var(--ink);border-radius:16px;background:var(--sun);display:flex;align-items:center;justify-content:center}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:var(--head);font-weight:700;font-size:18px;line-height:1.15;margin-bottom:4px}
.txt span{font-weight:700;font-size:14px;color:var(--muted)}
.arr{flex:none;font-family:var(--head);font-weight:700;font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <p class="hello" id="hello" hidden></p>
  <h1>Тренажёры</h1>
  <p class="lead">Карточки для повторения. Прогресс сохраняется сам.</p>
  <div class="list">
    <a class="item" href="mestoimeniya.html">
      <span class="ico"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="9" width="20" height="20" rx="4" fill="#fff" stroke="#1B1B2F" stroke-width="2.5"/><rect x="10" y="4" width="20" height="20" rx="4" fill="#E2336B" stroke="#1B1B2F" stroke-width="2.5"/></svg></span>
      <span class="txt"><b>Разряды местоимений</b><span>55 карточек · пример → разряд</span></span>
      <span class="arr">→</span>
    </a>
  </div>
</div>
<script>
let inited = false;
function tgInit(){
  const wa = window.Telegram && window.Telegram.WebApp;
  if (inited || !wa || !wa.initData) return;
  inited = true;
  try { wa.ready(); wa.expand(); } catch(e){}
  try { if (wa.isVersionAtLeast('6.1')){ wa.setHeaderColor('#FFF0B3'); wa.setBackgroundColor('#FFF0B3'); wa.BackButton.hide(); } } catch(e){}
  const u = wa.initDataUnsafe && wa.initDataUnsafe.user;
  if (u && u.first_name){ const h = document.getElementById('hello'); h.textContent = 'Привет, ' + u.first_name + '!'; h.hidden = false; }
}
window.__tgReady = tgInit;
tgInit();
</script>
</body>
